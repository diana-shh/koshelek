<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кошелёк</title>
<meta name="description" content="Личный учёт расходов по банковским выпискам. Данные хранятся только на телефоне.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Кошелёк">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F1F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E141A" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
@font-face { font-family: "Unbounded"; font-style: normal; font-weight: 600; font-display: swap; src: url(fonts/unbounded-cyrillic.woff2) format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: "Unbounded"; font-style: normal; font-weight: 600; font-display: swap; src: url(fonts/unbounded-latin-ext.woff2) format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: "Unbounded"; font-style: normal; font-weight: 600; font-display: swap; src: url(fonts/unbounded-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

/* Раскладка: одна колонка шириной с телефон; сверху крупный итог, ниже карточки; снизу панель из пяти вкладок под большим пальцем */
:root {
  --bg: #F1F4F6;
  --surface: #FFFFFF;
  --ink: #15202B;
  --muted: #5D6A77;
  --line: #DCE2E8;
  --track: #E7ECF0;
  --axis: #B9C3CC;
  --accent: #F2B705;
  --accent-ink: #1C1600;
  --pos: #13865A;
  --bar: #15202B;
  --bar-none: #B9C3CC;
  --danger: #B93434;
  --warn-bg: #FFF4D1;
  --warn-ink: #6B4E00;
  --hint-bg: #E6F1FB;
  --hint-ink: #174A7A;
  --shadow: rgba(16, 28, 40, .14);
  --backdrop: rgba(12, 18, 24, .45);
  --font-display: "Unbounded", -apple-system, system-ui, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E141A; --surface: #172029; --ink: #E7EDF2; --muted: #96A3B0; --line: #27333E;
    --track: #222D38; --axis: #3A4753; --accent: #F5C02E; --accent-ink: #1C1600;
    --pos: #34B27A; --bar: #D5DDE5; --bar-none: #56636F; --danger: #E77070;
    --warn-bg: #3A3010; --warn-ink: #F5D77A; --hint-bg: #13293D; --hint-ink: #A9CDF0;
    --shadow: rgba(0, 0, 0, .5); --backdrop: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E141A; --surface: #172029; --ink: #E7EDF2; --muted: #96A3B0; --line: #27333E;
  --track: #222D38; --axis: #3A4753; --accent: #F5C02E; --accent-ink: #1C1600;
  --pos: #34B27A; --bar: #D5DDE5; --bar-none: #56636F; --danger: #E77070;
  --warn-bg: #3A3010; --warn-ink: #F5D77A; --hint-bg: #13293D; --hint-ink: #A9CDF0;
  --shadow: rgba(0, 0, 0, .5); --backdrop: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
[hidden] { display: none !important; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.pos { color: var(--pos); }
.neg { color: var(--danger); }
h1, h2, h3 { text-wrap: balance; }

#screen { max-width: 600px; margin: 0 auto; padding-inline: 16px; padding-block: calc(env(safe-area-inset-top, 0px) + 10px) calc(env(safe-area-inset-bottom, 0px) + 96px); display: flex; flex-direction: column; gap: 18px; }

.scr-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.scr-head h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
.scr-head h1.brand { font-family: var(--font-display); font-weight: 600; font-size: 22px; letter-spacing: .01em; }

.eyebrow { display: block; font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.hero { display: flex; flex-direction: column; gap: 6px; }
.big { font-family: var(--font-display); font-weight: 600; font-size: clamp(32px, 10vw, 48px); line-height: 1.08; letter-spacing: -.015em; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
.split.three { grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 0; }
.split > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.val { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

.card { background: var(--surface); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card h2 { margin: 0; font-size: 17px; font-weight: 600; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.note { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.note p { margin: 0; }
.hint { margin: 0; background: var(--hint-bg); color: var(--hint-ink); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.empty { background: var(--surface); border-radius: 16px; padding: 18px 16px; color: var(--muted); }
.empty p { margin: 0 0 4px; }
.empty b { color: var(--ink); }
.big-empty { padding-block: 28px; }

.alert { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; background: var(--warn-bg); color: var(--warn-ink); border: 0; border-radius: 16px; padding: 14px 16px; cursor: pointer; font-size: 15px; }
.alert .muted { color: inherit; opacity: .8; }
.alert.soft { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.alert.soft .muted { color: var(--muted); opacity: 1; }
.alert > span:last-child { font-size: 22px; line-height: 1; }

.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn-row.center { justify-content: center; }
.btn-row > .primary, .btn-row > .secondary { flex: 1 1 160px; }
.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 14px; padding: 14px 16px; font-size: 16px; font-weight: 600; cursor: pointer; }
.secondary { background: transparent; color: var(--ink); border: 1px solid var(--axis); border-radius: 14px; padding: 13px 16px; font-size: 16px; font-weight: 500; cursor: pointer; }
.danger { background: var(--danger); color: #fff; border: 0; border-radius: 14px; padding: 14px 16px; font-size: 16px; font-weight: 600; cursor: pointer; }
.primary.small, .secondary.small, .danger.small { padding: 8px 14px; font-size: 14px; border-radius: 10px; flex: 0 0 auto; }
.primary:disabled, .secondary:disabled { opacity: .5; cursor: default; }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
.link { background: none; border: 0; padding: 6px 4px; color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.text-danger { background: none; border: 0; color: var(--danger); font-weight: 500; padding: 8px; cursor: pointer; }
.round { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface); font-size: 22px; line-height: 1; cursor: pointer; }
.x { background: none; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; }

.month { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 8px; }
.month h2 { margin: 0; text-align: center; font-size: 18px; font-weight: 600; }
.range-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--surface); border-radius: 14px; padding: 8px 12px; font-weight: 600; font-variant-numeric: tabular-nums; }

.filters { display: flex; flex-direction: column; gap: 8px; }
.filter-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filter-row > * { flex: 1 1 140px; min-width: 0; }
input[type="search"], select, .field input, .add-row input, .edit-list input, .rule-add input {
  font-size: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; width: 100%; min-height: 46px; color: var(--ink);
}
select { -webkit-appearance: none; appearance: none; padding-right: 32px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.sheet input[type="search"], .sheet select, .sheet .field input, .sheet .add-row input { background-color: var(--bg); }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); min-width: 0; }
.field input, .field select { color: var(--ink); }
.field input[type="date"] { -webkit-appearance: none; appearance: none; display: block; text-align: left; }
.range { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; cursor: pointer; }
.check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--ink); flex: none; }
.check.inline { align-items: center; }
.add-row { display: flex; gap: 8px; }
.add-row input { flex: 1; min-width: 0; }
.add-row select { flex: 0 0 auto; width: auto; }
.err { margin: 0; color: var(--danger); font-size: 14px; }

.sumline { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; font-variant-numeric: tabular-nums; }
.day { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.day-h { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); padding-inline: 4px; }
.day-h span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
.list { background: var(--surface); border-radius: 16px; overflow: hidden; }
.sheet .list { background: var(--bg); }
.tx { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 11px 14px; cursor: pointer; }
.tx.static { cursor: default; }
.tx:first-child { border-top: 0; }
.tx-main { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.tx-title { font-weight: 500; overflow-wrap: anywhere; }
.tx-sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.tx-note { font-size: 13px; overflow-wrap: anywhere; }
.amt { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.amt.transfer { color: var(--muted); font-weight: 500; }
.pill { display: inline-block; font-size: 11px; line-height: 1.5; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; vertical-align: 1px; }
.pill.warn { background: var(--warn-bg); color: var(--warn-ink); border-color: transparent; }
.pill.ok { color: var(--pos); border-color: var(--pos); }

.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 12px; align-items: baseline; width: 100%; background: none; border: 0; padding: 0; text-align: left; }
button.bar-row { cursor: pointer; padding-block: 2px; }
.bar-name { overflow-wrap: anywhere; }
.bar-val { font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap; }
.bar-val small { color: var(--muted); font-weight: 400; font-size: 13px; display: inline-block; min-width: 3.2em; text-align: right; }
.track { grid-column: 1 / -1; display: block; height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
.fill { display: block; height: 100%; border-radius: 3px; background: var(--bar); }
.fill.none { background: var(--bar-none); }

.readout { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.readout b { color: var(--ink); }
.cols { --h: 140px; position: relative; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); padding-top: 18px; }
.cols-grid { position: absolute; left: 0; right: 0; top: 18px; height: var(--h); pointer-events: none; }
.gl { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line); }
.gl i { position: absolute; left: 0; bottom: 2px; font-style: normal; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; background: var(--surface); padding-right: 4px; }
.col { background: none; border: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; cursor: pointer; min-width: 0; }
.col-bar { height: var(--h); display: flex; align-items: flex-end; justify-content: center; border-bottom: 1px solid var(--axis); }
.col-bar span { width: min(22px, 60%); background: var(--bar); border-radius: 4px 4px 0 0; }
.col:hover .col-bar span, .col:focus-visible .col-bar span { background: var(--accent); }
.col-l { font-size: 11px; color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; }

.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat-grid > div { background: var(--bg); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; font-variant-numeric: tabular-nums; }
.plain { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.plain li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.plain li:first-child { border-top: 0; }
.steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 10px; }

.q-card { gap: 14px; }
.q-title { font-size: 19px; font-weight: 600; overflow-wrap: anywhere; }
.q-meta { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.q-meta b { color: var(--ink); }
.q-meta b.pos { color: var(--pos); }
.q-ex { list-style: none; margin: 0; padding: 0; font-size: 14px; font-variant-numeric: tabular-nums; }
.q-ex li { display: flex; justify-content: space-between; padding: 4px 0; border-top: 1px dashed var(--line); }
.q-ex li:first-child { border-top: 0; }
.group { display: flex; flex-direction: column; gap: 8px; }
.group-h { font-size: 13px; color: var(--muted); font-weight: 500; }
details.more { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 10px; }
details.more > summary { cursor: pointer; color: var(--muted); font-size: 14px; list-style: none; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "+ "; }
details.more[open] > summary::before { content: "− "; }
details.more[open] > *:not(summary) { margin-top: 10px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; border: 0; padding: 0; margin: 0; min-width: 0; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chip span { display: inline-block; padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; cursor: pointer; }
.sheet .chip span { background: var(--bg); }
.chip input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.chip input:focus-visible + span { outline: 2px solid var(--ink); outline-offset: 2px; }
.chip-add { border: 1px dashed var(--axis); background: none; border-radius: 999px; padding: 8px 13px; font-size: 14px; color: var(--muted); cursor: pointer; }
.presets .chip span { padding: 7px 12px; }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--bg); border-radius: 12px; border: 0; margin: 0; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { text-align: center; padding: 10px 6px; border-radius: 9px; font-weight: 500; cursor: pointer; color: var(--muted); font-size: 15px; }
.seg input:checked + label { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px var(--shadow); }
.seg input:focus-visible + label { outline: 2px solid var(--ink); }
.amount { display: flex; align-items: baseline; gap: 8px; border-bottom: 2px solid var(--line); padding-bottom: 4px; }
.amount:focus-within { border-color: var(--ink); }
.amount input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font-family: var(--font-display); font-weight: 600; font-size: 38px; padding: 0; outline: none; font-variant-numeric: tabular-nums; }
.amount input::placeholder { color: var(--axis); }
.amount span { font-family: var(--font-display); font-size: 26px; color: var(--muted); }
.tx-head { display: flex; flex-direction: column; gap: 4px; }
.tx-head .big { font-size: 34px; }
.raw { font-size: 15px; overflow-wrap: anywhere; background: var(--bg); border-radius: 10px; padding: 8px 10px; margin-top: 4px; }
.del-zone { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; font-size: 14px; }

details.fold > summary { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; cursor: pointer; list-style: none; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary h2::after { content: " ›"; color: var(--muted); font-weight: 400; }
details.fold[open] > summary h2::after { content: " ⌄"; }
details.fold[open] { gap: 12px; }
.edit-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.edit-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.edit-list li.tag-li { grid-template-columns: minmax(0, 1fr) auto auto; }
.edit-list input { background: var(--bg); }
.rules { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.rules li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
.rules li:first-child { border-top: 0; }
.rule-text { min-width: 0; overflow-wrap: anywhere; font-size: 14px; }
.rule-add { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.rule-add input, .rule-add select { background-color: var(--bg); }
.rule-add .secondary { align-self: flex-start; }

dialog.sheet { margin: auto auto 0; width: 100%; max-width: 600px; max-height: 94dvh; overflow: auto; overscroll-behavior: contain; border: 0; border-radius: 22px 22px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--surface); color: var(--ink); }
dialog.sheet::backdrop { background: var(--backdrop); }
@media (min-width: 700px) { dialog.sheet { margin: auto; border-radius: 22px; padding-bottom: 20px; } }
.sheet-form { display: flex; flex-direction: column; gap: 16px; }
.sheet-form p { margin: 0; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: -16px; background: var(--surface); padding-block: 4px; z-index: 1; }
.sheet-head h3 { margin: 0; font-size: 18px; font-weight: 600; }
.file { overflow-wrap: anywhere; }

#tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
#tabbar > div { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
#tabbar button { position: relative; background: none; border: 0; padding: 8px 2px 7px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); cursor: pointer; }
#tabbar button[aria-current="page"] { color: var(--ink); font-weight: 600; }
#tabbar svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.badge { position: absolute; top: 3px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }

#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; width: max-content; max-width: calc(100% - 32px); box-shadow: 0 6px 20px var(--shadow); }
#busy { position: fixed; inset: 0; z-index: 50; background: var(--backdrop); display: grid; place-items: center; padding: 16px; }
#busy > div { background: var(--surface); border-radius: 16px; padding: 18px 20px; display: flex; gap: 12px; align-items: center; max-width: 100%; }
.spin { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--ink); flex: none; }
@media (prefers-reduced-motion: no-preference) { .spin { animation: spin .8s linear infinite; } .fill, .col-bar span { transition: width .25s ease, height .25s ease; } }
@keyframes spin { to { transform: rotate(360deg); } }
#update { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 8px); left: 50%; transform: translateX(-50%); z-index: 30; background: var(--ink); color: var(--bg); border: 0; border-radius: 999px; padding: 10px 16px; font-size: 14px; box-shadow: 0 6px 20px var(--shadow); cursor: pointer; }
</style>
</head>
<body>
<main id="screen"><div class="empty">Открываю кошелёк…</div></main>

<nav id="tabbar" aria-label="Разделы"><div>
  <button type="button" data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>Обзор</button>
  <button type="button" data-tab="ops"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r=".6"/><circle cx="4" cy="12" r=".6"/><circle cx="4" cy="18" r=".6"/></svg>Операции</button>
  <button type="button" data-tab="queue"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h4l1.5 3h5L16 13h4"/><path d="M5.5 5h13L20 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-6z"/></svg>Разобрать<span class="badge" id="queue-badge" hidden>0</span></button>
  <button type="button" data-tab="report"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16"/><path d="M6 20V11M11 20V5M16 20v-6"/></svg>Отчёт</button>
  <button type="button" data-tab="more"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>Ещё</button>
</div></nav>

<dialog class="sheet" id="sheet" aria-label="Карточка"></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="busy" hidden><div><span class="spin" aria-hidden="true"></span><span id="busy-text">Читаю файл…</span></div></div>
<button id="update" type="button" hidden>Есть новая версия · Обновить</button>
<input type="file" id="file-in" accept=".pdf,.xlsx,.xls,.csv,.txt,application/pdf,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" multiple hidden>
<input type="file" id="restore-in" accept=".json,application/json" hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
